[package]
name = "mrspace"
version = "0.1.0"
edition = "2021"
authors = ["You"]
description = "Windows on-demand window manager: pin, fit, and route windows across virtual desktops (Rust). Inspired by Mr. Space."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "mrspace"
path = "src/main.rs"
